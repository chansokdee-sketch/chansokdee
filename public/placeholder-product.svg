<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <rect x="20" y="20" width="360" height="360" rx="32" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Product / Camera Icon -->
  <g transform="translate(140, 120)">
    <rect x="10" y="25" width="100" height="80" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="60" cy="65" r="24" fill="#cbd5e1" />
    <circle cx="60" cy="65" r="14" fill="#f8fafc" />
    <rect x="35" y="12" width="50" height="15" rx="6" fill="#cbd5e1" />
    <circle cx="90" cy="42" r="5" fill="#94a3b8" />
  </g>

  <!-- Bilingual Label -->
  <text x="200" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">
    Chưa có ảnh sản phẩm
  </text>
  <text x="200" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    ຍັງບໍ່ມີຮູບພາບ • Cập nhật sau
  </text>
</svg>
